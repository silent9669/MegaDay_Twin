name: deploy-python-backend

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-python-backend
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_ACCOUNT_ID: 1177b93da7312e51a226b6ecffb1e251
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Set the production CLOUDFLARE_API_TOKEN secret before deploying the Python backend.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run check:backend
      - name: Require the private R2 state bucket
        # Create this once during account setup; never mask permission/network errors as absence.
        run: npx wrangler r2 bucket info megaday-decision-state
      - name: Build and smoke test the actual Linux image
        working-directory: .
        run: |
          docker build -f backend/Dockerfile -t megaday-backend-test .
          python scripts/hosted-smoke.py --image megaday-backend-test
      - name: Deploy private Python service and container
        run: npm run deploy:backend
      - name: Record deployment scope
        run: echo 'Python container uploaded. Verify authenticated HQ health after the web deployment; upload success alone does not prove readiness.' >> "$GITHUB_STEP_SUMMARY"
