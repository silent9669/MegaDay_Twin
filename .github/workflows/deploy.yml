name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep production updates serialized; a new push must not cancel an active deploy.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      deploy: ${{ fromJSON(steps.pending.outputs.result).deploy }}
      backend: ${{ fromJSON(steps.pending.outputs.result).backend }}
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment safeguards (no dependencies)
        run: node --test scripts/deployment.test.cjs
      - name: Check for changes not yet promoted
        id: pending
        uses: actions/github-script@v7
        with:
          script: |
            const { deploymentChanges } = require('./scripts/deployment.cjs');
            return await deploymentChanges(github, context);

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit

  deploy:
    needs: [changes, backend]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://megadaytwin.dangphuc.me
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
      - name: Promote and verify Cloudflare deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { promote, waitForBuild, verifyProduction } = require('./scripts/deployment.cjs');
            if (!await promote(github, context)) {
              core.notice('Deployment skipped: a newer main commit superseded this run.');
              await core.summary.addRaw('Skipped: a newer main commit will deploy. This run did not promote or verify production.').write();
              return;
            }
            const buildUrl = await waitForBuild(github, context);
            await core.summary.addLink('Cloudflare deployment', buildUrl).write();
            await verifyProduction();
            await core.summary.addRaw('Production health and access gate passed.').write();
