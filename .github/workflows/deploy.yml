name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep production updates serialized; a new push must not cancel an active deploy.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      deploy: ${{ steps.pending.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Test deployment safeguards (no dependencies)
        run: node --test scripts/deployment.test.cjs
      - name: Check for changes not yet promoted
        id: pending
        uses: actions/github-script@v7
        with:
          script: |
            const { needsDeployment } = require('./scripts/deployment.cjs');
            return await needsDeployment(github, context);

  backend:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit

  deploy:
    needs: [changes, backend]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://megadaytwin.dangphuc.me
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
      - name: Promote and verify Cloudflare deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { promote, waitForBuild, verifyProduction } = require('./scripts/deployment.cjs');
            await promote(github, context);
            const buildUrl = await waitForBuild(github, context);
            await core.summary.addLink('Cloudflare deployment', buildUrl).write();
            await verifyProduction();
            await core.summary.addRaw('Production health and access gate passed.').write();
