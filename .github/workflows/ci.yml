name: ci

# Full validation is opt-in; run the same checks locally before merging.
on:
  workflow_dispatch:

concurrency:
  group: manual-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Cài uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Cài Python 3.11
        run: uv python install 3.11
      - name: Cài phụ thuộc (theo uv.lock)
        run: uv sync --locked
      - name: Ruff (lint + format)
        run: |
          uv run ruff check --output-format=github
          uv run ruff format --check
      - name: Mypy
        run: uv run mypy app
      - name: Pytest (gồm test chống rò ground_truth)
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Local web validation (tests, lint, typecheck, build, dry run)
        run: npm run check
        env:
          CF_SEND_TELEMETRY: "false"

  mock-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify generated fixtures without modifying the checkout
        run: node scripts/check-mock-data.mjs

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Python container and verify restart persistence
        run: |
          docker build -f backend/Dockerfile -t megaday-backend-test .
          python scripts/hosted-smoke.py --image megaday-backend-test
