[project]
name = "megaday-twin-backend"
version = "0.1.0"
description = "MegaDay Twin backend: FastAPI + DuckDB + OpenAI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "rapidfuzz>=3.9",
    "unidecode>=1.3",
    "apscheduler>=3.10,<4",
    "sse-starlette>=2.1",
    "structlog>=24.1",
    "openai>=1.40",
    "python-ulid>=2.7",
    "typer>=0.12",
    "tzdata>=2024.1",
    "pytz>=2024.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC"]
# RUF001-003: Vietnamese strings legitimately contain ambiguous-looking unicode.
# N818: exception names come from the plan (DataQualityError, ConstraintViolation...).
ignore = ["RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = false

# 01 §7: strict for economics, simulator, forecast/base. core + warehouse are
# shared contracts, so they are strict as well (decision log INF-backend.md).
[[tool.mypy.overrides]]
module = [
    "app.core.*",
    "app.warehouse.*",
    "app.economics.*",
    "app.simulator.*",
    "app.forecast.base",
]
# `strict = true` is global-only in mypy; these are the per-module equivalents.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "statsmodels.*", "scipy.*", "apscheduler.*", "unidecode.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -m 'not perf'"
markers = [
    "integration: needs mock-data/out/nho",
    "e2e: needs mock-data/out/demo",
    "perf: đo thời gian, phụ thuộc máy; chạy riêng khi máy rảnh: pytest -m perf",
]
# DuckDB's DataFrame export calls DataFrame.drop(inplace=…), deprecated in pandas 3.1.
filterwarnings = ["ignore:The inplace keyword in DataFrame.drop is deprecated"]
